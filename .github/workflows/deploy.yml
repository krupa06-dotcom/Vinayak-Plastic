name: Build & Deploy to GitHub Pages

# The Astro site is statically generated, so a successful deploy is the only
# way admin changes become visible publicly. Every push to main rebuilds it.
#
# One-time repo setup (Settings -> Pages):
#   * Source: "GitHub Actions"
# And add the build-time Supabase values (Settings -> Secrets and variables ->
# Actions -> Variables). These are the PUBLISHABLE values, never the
# service-role key:
#   * SUPABASE_URL
#   * SUPABASE_PUBLISHABLE_KEY

on:
  push:
    branches: [main]
  workflow_dispatch:

permissions:
  contents: read
  pages: write
  id-token: write

concurrency:
  group: pages
  cancel-in-progress: true

jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Setup Node
        uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm

      - name: Install dependencies
        run: npm ci

      - name: Build site
        env:
          SUPABASE_URL: ${{ vars.SUPABASE_URL }}
          SUPABASE_PUBLISHABLE_KEY: ${{ vars.SUPABASE_PUBLISHABLE_KEY }}
        run: npm run build

      - name: Configure Pages
        uses: actions/configure-pages@v5

      - name: Upload artifact
        uses: actions/upload-pages-artifact@v3
        with:
          path: dist

  deploy:
    needs: build
    runs-on: ubuntu-latest
    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}
    steps:
      - name: Deploy to GitHub Pages
        id: deployment
        uses: actions/deploy-pages@v4
